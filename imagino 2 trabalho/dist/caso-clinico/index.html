/* Tokens do sistema visual (CLAUDE.md, seção 7). */
:root {
  --fundo: #0B0D10;
  --superficie: #15181D;
  --superficie-2: #1D2128;
  --borda: #2A2F37;
  --texto: #E8E6E1;
  --texto-sec: #9AA0A8;
  --acento: #F2A900;   /* exclusivo para anotações de achado */
  --certo: #5FB38A;    /* proposta do piloto — a confirmar */
  --errado: #D9695F;   /* proposta do piloto — a confirmar */
  --f-corpo: "Inter", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}

/* Janela da plateia. Palco fixo 1920×1080, escalonado com letterbox pelo motor. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--f-corpo); color: var(--texto); -webkit-font-smoothing: antialiased; }

#palco {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  background: var(--fundo);
  overflow: hidden;
  font-size: 32px; line-height: 1.35;
}

.cena { position: absolute; inset: 0; padding: 72px 96px; display: flex; flex-direction: column; animation: entra .35s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cena, .cena * { animation: none !important; transition: none !important; } }

/* HUD: custo acumulado sempre visível */
.hud { position: absolute; top: 32px; right: 48px; display: flex; gap: 16px; align-items: center; z-index: 5; }
.pilula { font-family: var(--f-mono); font-size: 26px; font-weight: 500; padding: 8px 20px; border-radius: 999px; background: var(--superficie); border: 1px solid var(--borda); color: var(--texto-sec); }
.pilula b { color: var(--texto); font-weight: 500; }
.pilula.piloto { color: var(--fundo); background: var(--texto-sec); border: none; }
.pilula.pulso { animation: pulso .8s ease-out; }
@keyframes pulso { 0% { background: var(--errado); color: var(--fundo); } 100% { background: var(--superficie); } }

.rotulo { font-family: var(--f-mono); font-size: 24px; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-sec); margin-bottom: 20px; }

/* ---------- capa e expositiva ---------- */
.capa { justify-content: center; align-items: flex-start; padding-left: 160px; }
.capa h1 { font-size: 140px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.capa .sub { margin-top: 36px; font-size: 40px; color: var(--texto-sec); }
.capa .linha { width: 160px; height: 6px; background: var(--texto); margin-bottom: 48px; }

.expositiva { justify-content: center; padding: 96px 200px; }
.expositiva h2 { font-size: 72px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 40px; }
.expositiva p { font-size: 40px; max-width: 1400px; color: var(--texto); }
.itens { list-style: none; counter-reset: i; display: flex; flex-direction: column; gap: 28px; margin-top: 16px; }
.itens li { counter-increment: i; display: flex; gap: 28px; align-items: baseline; font-size: 44px; }
.itens li::before { content: counter(i); font-family: var(--f-mono); font-weight: 500; font-size: 32px; color: var(--fundo); background: var(--texto); min-width: 56px; height: 56px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; transform: translateY(-4px); }

/* ---------- fala do paciente ---------- */
.fala { padding: 0; }
.fala .ilustracao { flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: #12151A; }
.fala .ilustracao svg { height: 100%; width: auto; max-width: 100%; }
.fala .ilustracao img { height: 100%; width: auto; animation: respira 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
.legenda { background: var(--superficie); border-top: 1px solid var(--borda); padding: 36px 160px 48px; min-height: 290px; display: flex; flex-direction: column; justify-content: center; }
.legenda .quem { font-family: var(--f-mono); font-size: 26px; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-sec); margin-bottom: 12px; }
.legenda .texto { font-size: 44px; line-height: 1.32; max-width: 1560px; }
.legenda .texto.entra { animation: entra .3s ease-out; }
.legenda .passos { display: flex; gap: 10px; margin-top: 24px; }
.legenda .passos i { width: 36px; height: 6px; border-radius: 3px; background: var(--borda); }
.legenda .passos i.feito { background: var(--texto-sec); }
.legenda .passos i.atual { background: var(--texto); }

/* personagens (SVG embutido): respiração, piscar, boca de quem fala */
.personagem { transition: opacity .4s ease, filter .4s ease; }
.personagem.calado { opacity: .5; filter: saturate(.6); }
.personagem .tronco { transform-box: fill-box; transform-origin: 50% 100%; animation: respira 4.5s ease-in-out infinite; }
.personagem[data-quem="A"] .tronco { animation-duration: 5.2s; animation-delay: -1.3s; }
.personagem .olhos { transform-box: fill-box; transform-origin: 50% 50%; animation: pisca 5.5s infinite; }
.personagem[data-quem="A"] .olhos { animation-duration: 6.3s; animation-delay: -2s; }
.personagem.falando .boca { transform-box: fill-box; transform-origin: 50% 0; animation: fala .32s ease-in-out infinite alternate; }
@keyframes respira { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
@keyframes pisca { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes fala { from { transform: scaleY(.6); } to { transform: scaleY(1.9); } }

/* ---------- menu ---------- */
.menu { padding-top: 96px; }
.menu .pergunta { font-size: 56px; font-weight: 600; letter-spacing: -.01em; max-width: 1500px; margin-bottom: 56px; line-height: 1.2; }
.opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.opcao { display: flex; gap: 28px; align-items: center; background: var(--superficie); border: 2px solid var(--borda); border-radius: 20px; padding: 32px 36px; min-height: 180px; transition: opacity .3s, border-color .3s; }
.opcao .tecla { flex: none; font-family: var(--f-mono); font-weight: 500; font-size: 44px; width: 84px; height: 84px; border-radius: 16px; background: var(--texto); color: var(--fundo); display: flex; align-items: center; justify-content: center; }
.opcao .rot { font-size: 36px; line-height: 1.25; }
.opcao.tentada { opacity: .5; border-style: dashed; }
.opcao.tentada .tecla { background: var(--superficie-2); color: var(--texto-sec); }
.opcao .marca { display: block; font-family: var(--f-mono); font-size: 24px; color: var(--errado); margin-top: 8px; }
.dica { margin-top: 36px; display: flex; gap: 24px; align-items: flex-start; padding: 28px 36px; border-left: 6px solid var(--texto-sec); background: var(--superficie); border-radius: 0 16px 16px 0; animation: entra .4s ease-out; }
.dica .quem { font-family: var(--f-mono); font-size: 24px; text-transform: uppercase; letter-spacing: .1em; color: var(--texto-sec); padding-top: 6px; white-space: nowrap; }
.dica .texto { font-size: 34px; font-style: italic; }

/* ---------- resultado / revelação com imagem ---------- */
.resultado { flex-direction: row; gap: 72px; padding: 72px 96px 56px; align-items: stretch; }
.resultado .imagem { flex: none; width: 936px; display: flex; flex-direction: column; }
.quadro { position: relative; width: 936px; height: 880px; background: #000; border-radius: 8px; overflow: hidden; }
.quadro img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.quadro img.anot { opacity: 0; transition: opacity .45s ease; }
.quadro.anotado img.anot { opacity: 1; }
.credito { font-family: var(--f-mono); font-size: 22px; color: var(--texto-sec); margin-top: 14px; }
.resultado .texto { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 40px; }
.resultado h2 { font-size: 56px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 32px; }
.laudo { font-size: 34px; line-height: 1.45; white-space: pre-line; }
.estado-anot { margin-top: 40px; font-family: var(--f-mono); font-size: 24px; color: var(--texto-sec); display: flex; align-items: center; gap: 14px; }
.estado-anot i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--texto-sec); }
.estado-anot.ligada { color: var(--acento); }
.estado-anot.ligada i { border-color: var(--acento); background: var(--acento); }

/* ---------- consequência ---------- */
.consequencia { justify-content: center; align-items: center; background: radial-gradient(ellipse at 50% 40%, #1a1214 0%, var(--fundo) 70%); }
.consequencia .cartao { max-width: 1400px; text-align: left; }
.consequencia .custo { font-family: var(--f-mono); font-size: 96px; font-weight: 500; color: var(--errado); line-height: 1; margin-bottom: 40px; }
.consequencia .custo small { font-size: 32px; color: var(--texto-sec); margin-left: 16px; }
.consequencia .texto { font-size: 48px; line-height: 1.3; margin-bottom: 36px; }
.consequencia .just { font-size: 32px; color: var(--texto-sec); padding-top: 28px; border-top: 1px solid var(--borda); }
.volta { position: absolute; bottom: 48px; right: 72px; font-family: var(--f-mono); font-size: 24px; color: var(--texto-sec); }

/* ---------- fechamento ---------- */
.fechamento { justify-content: center; padding: 72px 160px; }
.placar { display: flex; gap: 96px; align-items: flex-end; margin: 24px 0 56px; }
.placar .num { font-family: var(--f-mono); font-size: 180px; font-weight: 500; line-height: .9; }
.placar .num.ideal { color: var(--texto-sec); }
.placar .leg { font-size: 30px; color: var(--texto-sec); margin-top: 16px; }
.placar .vs { font-size: 48px; color: var(--texto-sec); padding-bottom: 60px; }
.fechamento .msg { font-size: 36px; margin-bottom: 12px; }

uta?","opcoes":[{"tecla":1,"rotulo":"Pedir ressonância do tornozelo agora","destino":"cons-m1-rm","custo":2,"correta":false,"justificativa":"Exame caro e demorado antes de examinar."},{"tecla":2,"rotulo":"Examinar o tornozelo e decidir se precisa de imagem","destino":"resultado-imagem","custo":0,"correta":true,"justificativa":"O exame à beira do leito orienta a indicação."},{"tecla":3,"rotulo":"Dar alta com gelo e repouso, sem examinar","destino":"cons-m1-alta","custo":3,"correta":false,"justificativa":"Uma lesão importante pode passar sem ser vista."}],"dica":"Antes de pedir qualquer imagem: o que as suas mãos podem descobrir agora?","notas":"Testar: 1 ou 3 levam à consequência e voltam; após 2 erros aparece a dica do preceptor. Z desfaz cada passo.","tempo_alvo_s":30},{"id":"cons-m1-rm","bloco":3,"tipo":"consequencia","legenda":"A ressonância só tem vaga daqui a três semanas. Até lá, ninguém examinou o pé.","justificativa":"Exame de alto custo pedido antes da avaliação clínica.","notas":"Consequência curta (≤ 30 s). → volta ao menu.","tempo_alvo_s":20},{"id":"cons-m1-alta","bloco":3,"tipo":"consequencia","legenda":"Dois dias depois, ele volta: não consegue mais apoiar o pé no chão.","justificativa":"Alta sem exame: atraso e retorno ao serviço.","notas":"Consequência curta (≤ 30 s). → volta ao menu.","tempo_alvo_s":20},{"id":"resultado-imagem","bloco":3,"tipo":"resultado","rotulo":"Resultado","titulo":"Imagem de teste","legenda":"Laudo fictício do piloto.\nTrês alvos (A, B e C) marcados na camada de anotação.\nPressione A para ligar e desligar.","imagens":[{"manifesto_id":"tst-01","anotacao":"tst-01-anot"}],"notas":"Testar a tecla A (anotação) e conferir o crédito sob a imagem.","tempo_alvo_s":40,"proxima":"revelacao"},{"id":"revelacao","bloco":6,"tipo":"revelacao","titulo":"Revelação","legenda":"Aqui aparece o diagnóstico pela primeira vez. No piloto: torção sem gravidade (fictício).","notas":"No painel, a prévia desta cena fica oculta na cena anterior.","tempo_al ground: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 150px; }\n.relogio .rot { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-sec); }\n.relogio b { font-family: var(--f-mono); font-weight: 500; font-size: 34px; line-height: 1.1; }\n.relogio b.passou { color: var(--errado); }\n.relogio b.estourou { color: var(--fundo); background: var(--errado); border-radius: 6px; padding: 0 6px; }\n.sec { font-size: 12px; color: var(--texto-sec); font-family: var(--f-mono); }\n.conexao { margin-left: auto; align-self: center; font-family: var(--f-mono); font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--borda); color: var(--texto-sec); }\n.conexao.ok { color: var(--certo); border-color: var(--certo); }\n.conexao.falha { color: var(--errado); border-color: var(--errado); }\nmain { flex: 1; display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; padding: 12px; min-height: 0; }\n.col { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; padding-right: 4px; }\nh2 { font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-sec); margin-top: 8px; }\n.mono { font-family: var(--f-mono); font-size: 12px; color: var(--texto-sec); letter-spacing: 0; text-transform: none; }\n.ops { list-style: none; display: flex; flex-direction: column; gap: 6px; }\n.ops li { display: flex; gap: 10px; background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px; padding: 8px 10px; }\n.ops li.correta { border-color: var(--certo); }\n.ops li.tentada { opacity: .55; }\n.ops em { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--errado); }\n.ops li.correta em { color: var(--certo); }\n.ops small { display: block; color: var(--texto-sec); font-size: 13px; }\n.k { flex: none; font-family: var(--f-mono); font-weight: 500; width: 26px; height: 26px; border-radius: 6px; background: var(--texto); color: var(--fundo); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }\n.fala { background: var(--superficie); border-radius: 8px; padding: 10px 14px; max-height: 55vh; overflow: auto; }\n.fala p { font-size: 20px; line-height: 1.4; padding: 6px 0; color: var(--texto-sec); }\n.fala p.atual { color: var(--texto); }\n.fala p.lida { opacity: .45; }\n.fala p.vazio { font-size: 14px; }\n.fala .quem { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-sec); }\n.notas { background: var(--superficie); border-radius: 8px; padding: 10px 14px; font-size: 15px; white-space: pre-line; }\n.proxima .prox { background: var(--superficie); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }\n.teclas { font-size: 13px; border-collapse: collapse; }\n.teclas td { padding: 3px 8px 3px 0; color: var(--texto-sec); }\n.teclas td:first-child { font-family: var(--f-mono); color: var(--texto); white-space: nowrap; }\n.dica-local { margin-top: 12px; font-size: 14px; padding: 8px 12px; border-radius: 8px; background: var(--superficie-2); opacity: 0; transition: opacity .2s; }\n.dica-local.visivel { opacity: 1; }\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"painel\">\n  \u003cheader>\n    \u003cdiv class=\"relogio\">\u003cspan class=\"rot\">Total\u003c/span>\u003cb id=\"t-total\">0:00\u003c/b>\u003cspan id=\"t-total-alvo\" class=\"sec\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"relogio\">\u003cspan class=\"rot\">Cena\u003c/span>\u003cb id=\"t-cena\">0:00\u003c/b>\u003cspan id=\"t-cena-alvo\" class=\"sec\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"relogio\">\u003cspan class=\"rot\">Custo\u003c/span>\u003cb id=\"custo\">0\u003c/b>\u003cspan class=\"sec\" id=\"custo-ideal\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"relogio\">\u003cspan class=\"rot\">Desvios no menu\u003c/span>\u003cb id=\"desvios\">—\u003c/b>\u003c/div>\n    \u003cdiv id=\"conexao\" class=\"conexao\">aguardando…\u003c/div>\n  \u003c/header>\n  \u003cmain>\n    \u003csection class=\"col\">\n      \u003ch2>Cena atual \u003cspan id=\"cena-id\" class=\"mono\">\u003c/span>\u003c/h2>\n      \u003cdiv id=\"opcoes\">\u003c/div>\n      \u003ch2>Fala a ler\u003c/h2>\n      \u003cdiv id=\"fala\" class=\"fala\">\u003c/div>\n      \u003ch2>Notas\u003c/h2>\n      \u003cdiv id=\"notas\" class=\"notas\">\u003c/div>\n    \u003c/section>\n    \u003csection class=\"col lateral\">\n      \u003ch2>Próxima\u003c/h2>\n      \u003cdiv id=\"proxima\" class=\"proxima\">\u003c/div>\n      \u003ch2>Teclas\u003c/h2>\n      \u003ctable class=\"teclas\">\n        \u003ctr>\u003ctd>→ / espaço / PgDn\u003c/td>\u003ctd>avançar\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>1–4\u003c/td>\u003ctd>registrar conduta\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Z\u003c/td>\u003ctd>desfazer\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>A\u003c/td>\u003ctd>anotação da imagem\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Shift+P\u003c/td>\u003ctd>forçar janela separada\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>R R\u003c/td>\u003ctd>reiniciar (2× em 3 s)\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>F\u003c/td>\u003ctd>tela cheia — só na janela da plateia\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cdiv id=\"dica-local\" class=\"dica-local\">\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\u003cscript>\n// Painel do apresentador. Roda na janela pop-up (window.opener) ou no iframe sobreposto\n// (window.parent). Não guarda estado de jogo: só exibe a \"visão\" enviada pela plateia.\n(() => {\n  'use strict';\n  const plateia = window.opener && !window.opener.closed ? window.opener : (window.parent !== window ? window.parent : null);\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;');\n  const mmss = (s) => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };\n  let v = null;\n  let ultimo = 0;\n  let ultimoJson = \"\";\n\n  function enviar(msg) { try { plateia?.postMessage(msg, '*'); } catch (_) { /* plateia fechada */ } }\n\n  function relogios() {\n    const con = $('conexao');\n    const vivo = plateia && !plateia.closed && Date.now() - ultimo \u003c 3500;\n    con.textContent = vivo ? 'conectado' : 'sem sinal da plateia';\n    con.className = 'conexao ' + (vivo ? 'ok' : 'falha');\n    if (!v) return;\n    const total = v.inicio ? (Date.now() - v.inicio) / 1000 : 0;\n    const cena = (Date.now() - v.inicioCena) / 1000;\n    $('t-total').textContent = mmss(total);\n    $('t-total').className = total > v.teto_s ? 'estourou' : total > v.alvo_total_s ? 'passou' : '';\n    $('t-total-alvo').textContent = `alvo ${mmss(v.alvo_total_s)} · teto ${mmss(v.teto_s)}`;\n    $('t-cena').textContent = mmss(cena);\n    $('t-cena').className = v.cena.tempo_alvo_s && cena > v.cena.tempo_alvo_s ? 'passou' : '';\n    $('t-cena-alvo').textContent = v.cena.tempo_alvo_s ? `alvo ${mmss(v.cena.tempo_alvo_s)}` : '';\n  }\n\n  function render() {\n    $('custo').textContent = v.custo;\n    $('custo-ideal').textContent = `ideal ${v.custo_ideal}`;\n    $('desvios').textContent = v.desvios == null ? '—' : `${v.desvios}${v.desvios >= 2 ? ' · dica visível' : ''}`;\n    $('cena-id').textContent = `${v.cena.id ?? '—'} · ${v.cena.tipo ?? ''}${v.anotacao ? ' · anotação ligada' : ''}`;\n\n    $('opcoes').innerHTML = v.opcoes ? `\u003col class=\"ops\">${v.opcoes.map((o) => `\n      \u003cli class=\"${o.correta ? 'correta' : ''}${o.tentada ? ' tentada' : ''}\">\n        \u003cspan class=\"k\">${o.tecla}\u003c/span>\n        \u003cspan>\u003cb>${esc(o.rotulo)}\u003c/b>${o.correta ? ' \u003cem>✓ avança\u003c/em>' : ` \u003cem>+${o.custo}\u003c/em>`}\n        ${o.justificativa ? `\u003csmall>${esc(o.justificativa)}\u003c/small>` : ''}\u003c/span>\n      \u003c/li>`).join('')}\u003c/ol>` : '';\n\n    if (v.legendas) {\n      $('fala').innerHTML = v.legendas.map((l, i) => `\u003cp class=\"${i === v.passo ? 'atual' : i \u003c v.passo ? 'lida' : ''}\">\u003cspan class=\"quem\">${esc(l.quem)}\u003c/span>${esc(l.texto)}\u003c/p>`).join('');\n      $('fala').querySelector('.atual')?.scrollIntoView({ block: 'nearest' });\n    } else $('fala').innerHTML = v.cena.fala ? `\u003cp class=\"atual\">${esc(v.cena.fala)}\u003c/p>` : '\u003cp class=\"vazio\">—\u003c/p>';\n\n    $('notas').textContent = v.cena.notas || '—';\n    $('proxima').innerHTML = v.proxima.map((p) => `\u003cdiv class=\"prox\">${p.tecla ? `\u003cspan class=\"k\">${p.tecla}\u003c/span>` : ''}${p.id ? `\u003cspan class=\"mono\">${esc(p.id)}\u003c/span> ` : ''}${esc(p.texto)}\u003c/div>`).join('');\n    relogios();\n  }\n\n  function aviso(t) {\n    const d = $('dica-local');\n    d.textContent = t;\n    d.classList.add('visivel');\n    clearTimeout(aviso.t);\n    aviso.t = setTimeout(() => d.classList.remove('visivel'), 2200);\n  }\n\n  // Atribuição por propriedade: se o documento for reescrito, o handler é substituído, não duplicado.\n  window.onmessage = (e) => {\n    if (e.source !== plateia) return;\n    const m = e.data || {};\n    ultimo = Date.now();\n    if (m.tipo === 'estado') {\n      const s = JSON.stringify(m.visao);\n      if (s !== ultimoJson) { ultimoJson = s; v = m.visao; render(); }\n    }\n    else if (m.tipo === 'aviso') aviso(m.texto);\n  };\n\n  window.onkeydown = (e) => {\n    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;\n    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;\n    if (k === 'f') { e.preventDefault(); return aviso('F só funciona na janela da plateia (o navegador exige o gesto lá).'); }\n    if (k === 'p') { e.preventDefault(); return; }\n    if (['ArrowRight', ' ', 'PageDown', 'Enter', '1', '2', '3', '4', 'z', 'a', 'r'].includes(k) || /^(Digit|Numpad)[1-4]$/.test(e.code)) {\n      e.preventDefault();\n      enviar({ tipo: 'tecla', key: e.key, code: e.code, shift: e.shiftKey });\n    }\n  };\n\n  // Batimento: a plateia responde a \"pronto\" com o estado; serve de sinal de conexão.\n  clearInterval(window.__painelBatimento);\n  window.__painelBatimento = setInterval(() => { enviar({ tipo: 'pronto' }); relogios(); }, 1000);\n  enviar({ tipo: 'pronto' });\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";</script>
<script>
// Motor do jogo — janela da plateia. Estado vive só aqui (CLAUDE.md, seção 3).
(() => {
  'use strict';
  const DADOS = JSON.parse(document.getElementById('dados').textContent);
  const { meta, cenas, midia } = DADOS;
  const CENA = Object.fromEntries(cenas.map((c) => [c.id, c]));
  const palco = document.getElementById('palco');
  const aviso = document.getElementById('aviso');

  // ---------- estado ----------
  const inicial = () => ({
    cenaId: cenas[0]?.id ?? null,
    passo: 0,            // trecho atual da legenda (cenas de fala)
    custo: 0,
    desvios: {},         // menuId -> nº de condutas erradas
    tentadas: {},        // menuId -> teclas erradas já escolhidas
    menuOrigem: null,    // menu para onde a consequência volta
    anotacao: false,
    escolhas: [],        // [{menu, tecla, correta, custo}]
    inicio: null,        // relógio total começa na primeira ação
    inicioCena: Date.now(),
  });
  let estado = inicial();
  const historico = [];

  const copia = (o) => JSON.parse(JSON.stringify(o));
  function registrar() { historico.push(copia(estado)); }
  function iniciarRelogio() { if (estado.inicio == null) estado.inicio = Date.now(); }

  function irPara(id) {
    estado.cenaId = id;
    estado.passo = 0;
    estado.anotacao = false;
    estado.inicioCena = Date.now();
  }

  // ---------- ações ----------
  function avancar() {
    const c = CENA[estado.cenaId];
    if (!c) return;
    if (c.tipo === 'menu' || c.tipo === 'fechamento') return;
    registrar(); iniciarRelogio();
    if (c.tipo === 'fala' && estado.passo < c.legendas.length - 1) { estado.passo++; return render(); }
    if (c.tipo === 'consequencia') irPara(c.destino ?? estado.menuOrigem);
    else if (c.proxima) irPara(c.proxima);
    render();
  }

  function escolher(tecla) {
    const c = CENA[estado.cenaId];
    if (!c || c.tipo !== 'menu') return;
    const op = c.opcoes.find((o) => o.tecla === tecla);
    if (!op) return;
    registrar(); iniciarRelogio();
    estado.custo += op.custo || 0;
    estado.escolhas.push({ menu: c.id, tecla, correta: !!op.correta, custo: op.custo || 0 });
    if (!op.correta) {
      estado.desvios[c.id] = (estado.desvios[c.id] || 0) + 1;
      estado.tentadas[c.id] = [...new Set([...(estado.tentadas[c.id] || []), tecla])];
      estado.menuOrigem = c.id;
    }
    irPara(op.destino);
    render();
    if (op.custo) pulsarCusto();
  }

  function desfazer() {
    if (!historico.length) return mostrarAviso('Nada para desfazer');
    const inicio = estado.inicio;
    estado = historico.pop();
    estado.inicio = inicio ?? estado.inicio; // o relógio total não volta
    estado.inicioCena = Date.now();
    render();
    mostrarAviso('Desfeito');
  }

  function alternarAnotacao() {
    const c = CENA[estado.cenaId];
    if (!c?.imagens?.some((i) => i.anotacao)) return;
    registrar();
    estado.anotacao = !estado.anotacao;
    const q = palco.querySelector('.quadro');
    q?.classList.toggle('anotado', estado.anotacao);
    const e = palco.querySelector('.estado-anot');
    if (e) { e.classList.toggle('ligada', estado.anotacao); e.lastChild.textContent = estado.anotacao ? 'Anotação ligada' : 'Anotação desligada (A)'; }
    enviarEstado();
  }

  let rPendente = 0;
  function reiniciar() {
    if (Date.now() - rPendente > 3000) { rPendente = Date.now(); return mostrarAviso('Pressione R de novo para reiniciar'); }
    rPendente = 0;
    estado = inicial();
    historico.length = 0;
    render();
    mostrarAviso('Jogo reiniciado');
  }

  function telaCheia() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => mostrarAviso('Tela cheia bloqueada pelo navegador'));
  }

  // ---------- teclado (plateia e painel usam o mesmo mapa) ----------
  function tratarTecla(key, code, shift) {
    const k = key.length === 1 ? key.toLowerCase() : key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') return avancar(), true;
    const n = /^Digit([1-4])$|^Numpad([1-4])$/.exec(code || '');
    if (n) return escolher(Number(n[1] || n[2])), true;
    if (['1', '2', '3', '4'].includes(k)) return escolher(Number(k)), true;
    if (k === 'z') return desfazer(), true;
    if (k === 'a') return alternarAnotacao(), true;
    if (k === 'r') return reiniciar(), true;
    if (k === 'f') return telaCheia(), true;
    if (k === 'p') return abrirPainel(shift), true;
    return false;
  }
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (tratarTecla(e.key, e.code, e.shiftKey)) e.preventDefault();
  });

  // ---------- escala do palco (letterbox) ----------
  function escalar() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    palco.style.transform = `scale(${s}) translate(-50%, -50%)`;
  }
  addEventListener('resize', escalar);
  escalar();

  // ---------- render ----------
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function hud(c) {
    const piloto = meta.piloto ? '<span class="pilula piloto">PILOTO</span>' : '';
    if (c.layout === 'capa') return `<div class="hud">${piloto}</div>`;
    return `<div class="hud">${piloto}<span class="pilula" id="hud-custo">Custo <b>${estado.custo}</b></span></div>`;
  }

  function imagemHtml(c) {
    const im = c.imagens[0];
    const limpo = midia[im.manifesto_id];
    const anot = im.anotacao ? midia[im.anotacao] : null;
    return `<div class="imagem">
      <div class="quadro${estado.anotacao ? ' anotado' : ''}">
        <img src="${esc(limpo.src)}" alt="">
        ${anot ? `<img class="anot" src="${esc(anot.src)}" alt="">` : ''}
      </div>
      <div class="credito">${esc(limpo.credito)}</div>
    </div>`;
  }

  const LAYOUTS = {
    expositiva(c) {
      if (c.layout === 'capa') return `<div class="cena capa"><div class="linha"></div><h1>${esc(c.titulo || meta.titulo)}</h1>${c.legenda ? `<div class="sub">${esc(c.legenda)}</div>` : ''}</div>`;
      return `<div class="cena expositiva">
        ${c.titulo ? `<h2>${esc(c.titulo)}</h2>` : ''}
        ${c.legenda ? `<p>${esc(c.legenda)}</p>` : ''}
        ${c.itens ? `<ol class="itens">${c.itens.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}
      </div>`;
    },
    fala(c) {
      const trecho = c.legendas[estado.passo];
      const ilu = c.ilustracao ? midia[c.ilustracao] : null;
      const nomes = c.personagens || {};
      return `<div class="cena fala">
        <div class="ilustracao">${ilu ? (ilu.svg || `<img src="${esc(ilu.src)}" alt="">`) : ''}</div>
        <div class="legenda">
          <div class="quem">${esc(nomes[trecho.quem] || trecho.quem || '')}</div>
          <div class="texto entra">${esc(trecho.texto)}</div>
          <div class="passos">${c.legendas.map((_, i) => `<i class="${i < estado.passo ? 'feito' : i === estado.passo ? 'atual' : ''}"></i>`).join('')}</div>
        </div>
      </div>`;
    },
    menu(c) {
      const tentadas = estado.tentadas[c.id] || [];
      const dica = (estado.desvios[c.id] || 0) >= 2 && c.dica;
      return `<div class="cena menu">
        <div class="rotulo">Decisão da turma</div>
        <div class="pergunta">${esc(c.legenda)}</div>
        <div class="opcoes">${c.opcoes.map((o) => {
          const t = tentadas.includes(o.tecla);
          return `<div class="opcao${t ? ' tentada' : ''}" data-tecla="${o.tecla}"><span class="tecla">${o.tecla}</span><span class="rot">${esc(o.rotulo)}${t ? `<span class="marca">já tentada · +${o.custo}</span>` : ''}</span></div>`;
        }).join('')}</div>
        ${dica ? `<div class="dica"><span class="quem">Preceptor</span><span class="texto">${esc(c.dica)}</span></div>` : ''}
      </div>`;
    },
    resultado(c) {
      if (!c.imagens?.length) return LAYOUTS.expositiva(c);
      const temAnot = c.imagens.some((i) => i.anotacao);
      return `<div class="cena resultado">
        ${imagemHtml(c)}
        <div class="texto">
          ${c.titulo ? `<div class="rotulo">${esc(c.rotulo || 'Resultado')}</div><h2>${esc(c.titulo)}</h2>` : ''}
          <div class="laudo">${esc(c.legenda)}</div>
          ${temAnot ? `<div class="estado-anot${estado.anotacao ? ' ligada' : ''}"><i></i><span>${estado.anotacao ? 'Anotação ligada' : 'Anotação desligada (A)'}</span></div>` : ''}
        </div>
      </div>`;
    },
    revelacao(c) { return LAYOUTS.resultado(c); },
    consequencia(c) {
      const ult = estado.escolhas[estado.escolhas.length - 1];
      const custo = c.custo ?? ult?.custo ?? 0;
      return `<div class="cena consequencia"><div class="cartao">
        <div class="custo">+${custo}<small>pontos de custo</small></div>
        <div class="texto">${esc(c.legenda)}</div>
        ${c.justificativa ? `<div class="just">${esc(c.justificativa)}</div>` : ''}
      </div><div class="volta">→ voltar à decisão</div></div>`;
    },
    fechamento(c) {
      const refs = Object.values(midia).filter((m) => m.tipo !== 'ilustracao').map((m) => m.referencia);
      return `<div class="cena fechamento">
        <div class="rotulo">Placar</div>
        <div class="placar">
          <div><div class="num">${estado.custo}</div><div class="leg">custo da turma</div></div>
          <div class="vs">×</div>
          <div><div class="num ideal">${meta.custo_ideal}</div><div class="leg">caminho ideal</div></div>
        </div>
        ${(c.itens || []).map((t) => `<div class="msg">${esc(t)}</div>`).join('')}
        ${refs.length ? `<div class="referencias">${[...new Set(refs)].map(esc).join('<br>')}</div>` : ''}
      </div>`;
    },
  };

  function render() {
    const c = CENA[estado.cenaId];
    if (!c) {
      palco.innerHTML = `<div class="cena capa"><div class="linha"></div><h1>${esc(meta.titulo)}</h1><div class="sub">Nenhuma cena no build.</div></div>`;
      return enviarEstado();
    }
    palco.innerHTML = (LAYOUTS[c.tipo] || LAYOUTS.expositiva)(c) + hud(c);
    if (c.tipo === 'fala') marcarFalante(c);
    enviarEstado();
  }

  function marcarFalante(c) {
    const quem = c.legendas[estado.passo].quem;
    const falantes = new Set(c.legendas.map((l) => l.quem));
    palco.querySelectorAll('.personagem').forEach((g) => {
      const q = g.dataset.quem;
      g.classList.toggle('falando', q === quem);
      g.classList.toggle('calado', falantes.has(quem) && q !== quem && ['P', 'A'].includes(quem));
    });
  }

  function pulsarCusto() {
    const p = document.getElementById('hud-custo');
    if (p) { p.classList.remove('pulso'); void p.offsetWidth; p.classList.add('pulso'); }
  }

  let tAviso;
  function mostrarAviso(t) {
    aviso.textContent = t;
    aviso.classList.add('visivel');
    clearTimeout(tAviso);
    tAviso = setTimeout(() => aviso.classList.remove('visivel'), 1800);
    enviar({ tipo: 'aviso', texto: t });
  }

  // ---------- painel do apresentador ----------
  // Janela about:blank escrita por document.write (herda a origem, funciona em file://).
  // Comunicação só por postMessage com checagem de event.source (sem BroadcastChannel).
  let painel = null;     // Window do painel (popup ou iframe sobreposto)
  let sobreposto = null; // <iframe> no modo de uma tela só

  // P: automático (duas telas → janela separada; uma tela → painel sobreposto).
  // Shift+P: sempre janela separada (útil para ensaiar o pop-up com uma tela só).
  function abrirPainel(forcarJanela) {
    if (!forcarJanela && window.screen.isExtended === false) return alternarSobreposto();
    const w = window.open('', 'apresentador-caso-clinico', 'popup=yes,width=1280,height=800');
    if (!w) { mostrarAviso('Pop-up bloqueado: usando painel sobreposto'); return alternarSobreposto(); }
    if (sobreposto) alternarSobreposto();
    // Painel já aberto (P de novo, ou plateia recarregada): só reconecta.
    let aberto;
    try { aberto = !!w.document.getElementById('painel'); } catch (_) { aberto = true; }
    if (!aberto) {
      w.document.open();
      w.document.write(window.PAINEL_HTML);
      w.document.close();
    }
    painel = w;
    enviarEstado();
    w.focus();
  }

  function alternarSobreposto() {
    if (sobreposto) { sobreposto.remove(); sobreposto = null; painel = null; return; }
    sobreposto = document.createElement('iframe');
    sobreposto.id = 'sobreposto';
    sobreposto.srcdoc = window.PAINEL_HTML;
    document.body.appendChild(sobreposto);
    painel = sobreposto.contentWindow;
  }

  function enviar(msg) {
    if (painel && !painel.closed) { try { painel.postMessage(msg, '*'); } catch (_) { /* painel fechado */ } }
  }

  // Descrição da próxima cena para o painel. A Revelação nunca é antecipada no painel:
  // no modo de uma tela só o painel aparece no projetor.
  function previa(id) {
    const c = CENA[id];
    if (!c) return { texto: '—' };
    if (c.tipo === 'revelacao') return { id, tipo: c.tipo, texto: 'Revelação — conteúdo oculto no painel' };
    return { id, tipo: c.tipo, texto: c.titulo || c.legenda || c.legendas?.[0]?.texto || '' };
  }

  function visao() {
    const c = CENA[estado.cenaId] || {};
    let proxima;
    if (c.tipo === 'menu') proxima = c.opcoes.map((o) => ({ tecla: o.tecla, ...previa(o.destino) }));
    else if (c.tipo === 'fala' && estado.passo < c.legendas.length - 1) proxima = [{ texto: `Próximo trecho (${estado.passo + 2}/${c.legendas.length}): ${c.legendas[estado.passo + 1].texto}` }];
    else if (c.tipo === 'consequencia') proxima = [previa(c.destino ?? estado.menuOrigem)];
    else proxima = [previa(c.proxima)];
    return {
      cena: { id: c.id, tipo: c.tipo, tempo_alvo_s: c.tempo_alvo_s, notas: c.notas || '', fala: c.fala || '' },
      legendas: c.tipo === 'fala' ? c.legendas.map((l) => ({ quem: (c.personagens || {})[l.quem] || l.quem, texto: l.texto })) : null,
      passo: estado.passo,
      opcoes: c.tipo === 'menu' ? c.opcoes.map((o) => ({ tecla: o.tecla, rotulo: o.rotulo, correta: !!o.correta, custo: o.custo, justificativa: o.justificativa || '', tentada: (estado.tentadas[c.id] || []).includes(o.tecla) })) : null,
      desvios: c.tipo === 'menu' ? (estado.desvios[c.id] || 0) : (c.tipo === 'consequencia' ? (estado.desvios[estado.menuOrigem] || 0) : null),
      custo: estado.custo,
      custo_ideal: meta.custo_ideal,
      inicio: estado.inicio,
      inicioCena: estado.inicioCena,
      alvo_total_s: meta.alvo_total_s,
      teto_s: meta.teto_s,
      anotacao: estado.anotacao,
      proxima,
      historico: historico.length,
    };
  }

  function enviarEstado() { enviar({ tipo: 'estado', visao: visao() }); }

  window.addEventListener('message', (e) => {
    if (!painel || e.source !== painel) return;
    const m = e.data || {};
    if (m.tipo === 'pronto') enviarEstado();
    else if (m.tipo === 'tecla') tratarTecla(m.key, m.code, m.shift);
  });

  // Interface mínima para testes automatizados (não altera o comportamento).
  window.__jogo = { estado: () => copia(estado), historico: () => historico.length };

  render();
})();

</script>
